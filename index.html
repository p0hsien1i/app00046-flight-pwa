<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brian in the Air</title>
  <meta name="theme-color" content="#0A0F1E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brian Air">
  <link rel="manifest" href="manifest.webmanifest">

<body>

  <div id="update-banner" class="banner update hidden"></div>
  <div id="offline-banner" class="banner offline hidden"></div>

  <section id="page-trips" class="page active">
    <div class="page-title"><span id="trips-title"></span></div>

  </section>

  <section id="page-detail" class="page"></section>

  <section id="page-stats" class="page">
    <div class="page-title"><span id="stats-title"></span></div>
    <div id="stats-body"></div>

  <section id="page-settings" class="page">
    <div class="page-title"><span id="settings-title"></span></div>
    <div id="settings-body"></div>
  </section>

  <button id="fab" class="fab" aria-label="Add flight">+</button>

  <nav class="tabbar">

      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 15.5v-2l-8.5-5V3.2c0-.8-.7-1.5-1.5-1.5S10 2.4 10 3.2v5.3l-8.5 5v2L10 13v5.5L7.5 20v1.5l4-1 4 1V20L13 18.5V13l8.5 2.5z"/></svg>

  </nav>

  <script src="labels.js"></script>
  <script src="airports.js"></script>
  <script src="vendor/worldmap.js"></script>

</html>
